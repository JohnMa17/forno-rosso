<!DOCTYPE html>
<!-- =============================================================================
     FORNO ROSSO · reservas.html
     Dueño: M01 · Estructura y SEO     Rama: feature/m01-estructura

     Los ids, las clases que ya trae y el data-pagina del body son CONTRATOS:
     otros módulos los usan. No cambiarlos sin avisar al grupo.
     Nada de <style>, style="..." ni <script> dentro del HTML (la CSP los bloquea).
     ============================================================================= -->
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Reservas · Forno Rosso</title>
  <meta name="description" content="TODO M01: descripción de la página de reservas.">

  <link rel="stylesheet" href="css/variables.css">
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/componentes.css">
  <link rel="stylesheet" href="css/layout.css">
</head>
<body data-pagina="reservas">

  <header>
    <!-- TODO M01: logo -->
    <a href="index.html">Forno Rosso</a>
    <nav id="nav-principal" aria-label="Principal">
      <a href="index.html">Inicio</a>
      <a href="menu.html">Menú</a>
      <a href="reservas.html">Reservas</a>
      <a href="nosotros.html">Nosotros</a>
    </nav>
    <button type="button" id="btn-modo" class="btn-secundario" aria-label="Cambiar modo oscuro">Modo oscuro</button>
  </header>

  <main class="contenedor">
    <h1>Reservas</h1>

    <!-- novalidate: los mensajes de error los pone M07, no el navegador -->
    <form id="form-reserva" novalidate>
      <div class="campo">
        <label for="nombre">Nombre</label>
        <input type="text" id="nombre" name="nombre" autocomplete="name">
        <span class="error" id="error-nombre"></span>
      </div>
      <div class="campo">
        <label for="telefono">Teléfono</label>
        <input type="tel" id="telefono" name="telefono" autocomplete="tel">
        <span class="error" id="error-telefono"></span>
      </div>
      <div class="campo">
        <label for="correo">Correo</label>
        <input type="email" id="correo" name="correo" autocomplete="email">
        <span class="error" id="error-correo"></span>
      </div>
      <div class="campo">
        <label for="fecha">Fecha</label>
        <input type="date" id="fecha" name="fecha">
        <span class="error" id="error-fecha"></span>
      </div>
      <div class="campo">
        <label for="hora">Hora</label>
        <input type="time" id="hora" name="hora">
        <span class="error" id="error-hora"></span>
      </div>
      <div class="campo">
        <label for="personas">Personas</label>
        <input type="number" id="personas" name="personas" min="1" max="12">
        <span class="error" id="error-personas"></span>
      </div>
      <div class="campo">
        <label for="comentario">Comentario (opcional)</label>
        <textarea id="comentario" name="comentario" maxlength="200"></textarea>
        <span class="error" id="error-comentario"></span>
      </div>

      <button type="submit" id="btn-reservar" class="btn">Reservar</button>
      <p id="mensaje-reserva" aria-live="polite"></p>
    </form>
  </main>

  <footer>
    <!-- TODO M01: dirección, teléfono y redes -->
    <p>Forno Rosso</p>
  </footer>

  <!-- El orden importa: unos archivos usan funciones de otros -->
  <script src="js/seguridad.js"></script>
  <script src="js/datos.js"></script>
  <script src="js/menu.js"></script>
  <script src="js/interactividad.js"></script>
  <script src="js/reservas.js"></script>
  <script src="js/main.js"></script>
</body>
</html>
